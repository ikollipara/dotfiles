set -g @plugin "joshmedeski/t-smart-tmux-session-manager"
set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags

set -g @plugin "tmux-plugins/tpm"

set -g @catppuccin_flavor 'mocha' 

set -g status on
set -g status-interval 1
set -g status-left-length 100
set -g status-right-length 100
# set -g status-style "fg=white,bg=#1c1c24"
set -g status-justify absolute-centre

#set -g status-left "#[fg=black,bg=cyan]  #H #[fg=white,bg=black]  #S #{prefix_highlight}"
# set -g status-right " #[fg=white,bg=black] 󰃭 %A %d %b #[fg=black,bg=cyan] 󰥔 %I:%M:%S %p "
# set -g status-left "#{E:@catppuccin_status_application}"
#set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
# set -ag status-left "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
#set -agF status-right "#{E:@catppuccin_status_battery}"

# setw -g window-status-separator " "
# setw -g window-status-format "#[fg=black,bg=brightwhite] #I #[fg=white,bg=black] #W "
#setw -g window-status-current-format "#[fg=black,bg=yellow] #I #[fg=white,bg=black] #W "


# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=black]#[bg=yellow]"
set -g @prefix_highlight_output_suffix ""

bind-key x kill-pane
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g @t-fzf-prompt '  '
set-option -ga terminal-overrides ",xterm-256color:Tc"

bind-key -n 'M-h' 'select-pane -L'
bind-key -n 'M-j' 'select-pane -D'
bind-key -n 'M-k' 'select-pane -U'
bind-key -n 'M-l' 'select-pane -R'

bind-key -n 'M-Space' 'select-pane -t:.+'
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l
bind-key -T copy-mode-vi 'M-Space' select-pane -t:.+
unbind s
unbind S
unbind C-f
unbind -n C-f
unbind C-b
bind-key s split-window -h
bind-key S split-window -v

set-option -g prefix C-j
bind-key C-j last-window
bind-key r source-file $HOME/.config/tmux/tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key M split-window -h "hx $HOME/.config/tmux/tmux.conf"
bind-key -n C-g display-popup -b none -E -w 70% -h 50% "lazygit"
bind-key C-y display-popup -b none -E -w 70% -h 50% "~/.config/helix/yazi-picker.sh hx"
bind-key -n C-t run-shell "t"

set-option -g status-position top
set -g 'status-format[1]' ''

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
run '~/.config/tmux/plugins/tpm/tpm'
